# The four modern photographs of the original course assignment, plus the
# historical one as the localisation query.
dataset: valencia
seed: 0

calibrate:
  exif: true                # 26 mm equivalent on a 4:3 sensor: f = 3029 px
  sensor_aspect: [4, 3]     # the phone's whole sensor; the photos are a 16:9 cut

sfm:
  images: [Img02, Img25, Img15, Img23]
  reference: Img02
  exhaustive: true
  max_keypoints: 2048
  device: auto              # auto | cpu | cuda: CPU and GPU give slightly different matches
  ransac_threshold: 4.0
  ransac_iterations: 1000
  min_inliers: 20
  min_track_length: 2
  min_triangulation_angle_deg: 2.0
  max_reprojection_error: 12.0
  pnp_threshold: 6.0

localize:
  query: Img00

colmap:
  precomputed: precomputed/colmap/9cameras_sfmkit_matches
