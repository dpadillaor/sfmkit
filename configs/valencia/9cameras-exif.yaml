# 9cameras-dense with the camera's K from the photos' EXIF instead of the
# course's chessboard K, which is ~17% too long (see TODO.md). For a machine
# with an NVIDIA GPU: GPU matches, COLMAP on the GPU, and the dense cloud.
dataset: valencia
seed: 0

calibrate:
  exif: true                # 26 mm equivalent on a 4:3 sensor: f = 3029 px
  sensor_aspect: [4, 3]     # the phone's whole sensor; the photos are a 16:9 cut

sfm:
  images: [Img02, Img12, Img13, Img14, Img15, Img23, Img24, Img25, Img28]
  reference: Img02
  exhaustive: true
  max_keypoints: 2048
  device: auto
  ransac_threshold: 4.0
  ransac_iterations: 1000
  min_inliers: 20
  min_track_length: 2
  min_triangulation_angle_deg: 2.0
  max_reprojection_error: 12.0
  pnp_threshold: 6.0

localize:
  query: Img00

colmap:
  matches: colmap   # COLMAP's own features: a reference independent of ours
  camera: self      # COLMAP calibrates the phone itself

dense:
  enabled: true
  max_image_size: 2000
