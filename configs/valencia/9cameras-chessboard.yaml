# 9cameras-colmap with the course's chessboard K instead of the photos' EXIF:
# ~17% too long (see TODO.md), kept to compare against until the chessboard is
# redone. Paths are relative to data/valencia/.
dataset: valencia
seed: 0

calibrate:
  intrinsics: precomputed/K.txt   # the course's chessboard, photos lost

sfm:
  images: [Img02, Img12, Img13, Img14, Img15, Img23, Img24, Img25, Img28]
  reference: Img02
  exhaustive: true
  max_keypoints: 2048
  device: auto
  ransac_threshold: 4.0
  ransac_iterations: 1000
  min_inliers: 20
  min_track_length: 2
  min_triangulation_angle_deg: 2.0
  max_reprojection_error: 12.0
  pnp_threshold: 6.0

localize:
  query: Img00

colmap:
  matches: colmap   # COLMAP's own features: a reference independent of ours
  camera: self      # COLMAP calibrates the phone itself

dense:
  enabled: false
