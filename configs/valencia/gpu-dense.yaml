# The whole pipeline on a machine with an NVIDIA GPU: matching and COLMAP on
# the GPU, and COLMAP's dense point cloud of the scene. Scored against COLMAP
# run from scratch on the same photos, its own features and matching: a
# reference that shares nothing with sfmkit but the photos. Paths are relative
# to data/valencia/.
dataset: valencia
seed: 0

calibrate:
  exif: true                # 26 mm equivalent on a 4:3 sensor: f = 3029 px
  sensor_aspect: [4, 3]     # the phone's whole sensor; the photos are a 16:9 cut

sfm:
  images: [Img02, Img11, Img12, Img13, Img14, Img15, Img16, Img17, Img18, Img19, Img20,
           Img23, Img24, Img25]
  reference: Img02
  exhaustive: true          # every pair, not just those touching the reference
  max_keypoints: 2048
  device: cuda              # auto | cpu | cuda: CPU and GPU give slightly different matches
  ransac_threshold: 4.0
  ransac_iterations: 1000
  min_inliers: 20
  min_track_length: 2
  min_triangulation_angle_deg: 2.0
  max_reprojection_error: 12.0
  pnp_threshold: 6.0

localize:
  query: Img00

colmap:
  matches: colmap   # colmap: COLMAP's own features | sfmkit: this run's verify/
  camera: self      # self: COLMAP calibrates the phone | fixed: calibrate's K

dense:
  enabled: true     # COLMAP's dense point cloud of the scene; needs CUDA
  max_image_size: 2000
