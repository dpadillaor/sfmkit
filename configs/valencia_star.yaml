# The nine modern photographs COLMAP registered, plus the historical one as the
# localisation query. Image names match the files in the dataset directory.
name: valencia_star
images_dir: CV/DPO2/colmap_project/images
image_names: [Img02, Img12, Img13, Img14, Img15, Img23, Img24, Img25, Img28]
reference: Img02
query: Img00
intrinsics: CV/DPO2/Camera_calibration/Calibration_12MP/K_Calibration_12MP.txt
colmap_model: CV/DPO2/colmap_project/output
seed: 0

exhaustive: false         # reference pairs only: reproduces the original topology
max_keypoints: 2048
ransac_threshold: 4.0
ransac_iterations: 1000
min_inliers: 20

min_track_length: 2
min_triangulation_angle_deg: 2.0
max_reprojection_error: 12.0
pnp_threshold: 6.0
