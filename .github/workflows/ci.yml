name: Checks

on:
  # The two moments that matter: a change proposed, and a change landing. A
  # branch of one's own is not built until it asks to come in, and a pull
  # request from this repository is built once, not twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # and a button, for when neither has happened

concurrency:
  # A pull request pushed five times only needs its last run. A run on main is
  # the one that says whether the branch is sound, and is never cut short.
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: sfmkit (CPU)
    runs-on: ubuntu-latest
    # A broker for the tests of live progress, which are skipped without one.
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SFMKIT_TEST_REDIS: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # the version the requirements are frozen for
          cache: pip
          cache-dependency-path: packages/sfmkit/requirements*.txt

      - name: Install
        working-directory: packages/sfmkit
        # The same pinned environment as the image, installed the same way.
        run: |
          pip install --no-deps -r requirements-cpu.txt -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Check the layering
        working-directory: packages/sfmkit
        # The architecture is a contract, not a comment: this fails the build if
        # a layer imports upwards, or if the core acquires an I/O dependency.
        run: lint-imports

      - name: Test
        working-directory: packages/sfmkit
        run: pytest -q --cov=sfmkit --cov-report=term-missing

  viewer:
    name: sfmview
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SFMVIEW_TEST_REDIS: redis://localhost:6379/15
    defaults:
      run:
        working-directory: packages/viewer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/viewer/requirements*.txt

      - name: Install
        # Its own environment: if the viewer imported sfmkit, this would fail.
        run: |
          pip install --no-deps -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -e .

      - name: sfmkit must not be importable here
        # The independence is the design; this is the one place it can be
        # proved rather than asserted.
        run: |
          if python -c "import sfmkit" 2>/dev/null; then
            echo "sfmkit is importable in the viewer's environment; the packages have leaked"
            exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Check the layering
        run: lint-imports

      - name: Test
        run: pytest -q

  regression:
    name: The saved example, run again
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/sfmkit/requirements*.txt

      - name: Install
        run: |
          pip install --no-deps -r packages/sfmkit/requirements-cpu.txt \
                                -r packages/sfmkit/requirements.txt
          pip install --no-deps -e packages/sfmkit

      # From `verify` onwards only: `match` would download the feature weights,
      # whose licence is not ours to accept on anyone's behalf. The example's
      # COLMAP model is the reference, so what moves here is our own code.
      - name: Re-run the pipeline on the saved example
        run: |
          mkdir -p /tmp/check/valencia
          cp -r examples/valencia/cpu /tmp/check/valencia/
          for stage in verify reconstruct localize evaluate; do
            SFMKIT_RUNS=/tmp/check sfmkit "$stage" --config configs/valencia/cpu.yaml
          done

      - name: The numbers must not have moved
        run: |
          python - <<'EOF'
          import json, sys
          got = json.load(open("/tmp/check/valencia/cpu/evaluate/evaluation.json"))
          print(json.dumps({k: got[k] for k in ("n_cameras", "mean_rotation_error_deg")}))
          ok = got["n_cameras"] == 14
          ok &= abs(got["mean_rotation_error_deg"] - 0.338) < 0.02
          sys.exit(0 if ok else 1)
          EOF
