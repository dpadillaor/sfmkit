name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Only one test reads the dataset, to check the shipped configs point at
        # real files; the rest run against synthetic scenes with exact ground truth.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Check the layering
        # The architecture is a contract, not a comment: this fails the build if
        # a layer imports upwards, or if the core acquires an I/O dependency.
        run: lint-imports

      - name: Test
        run: pytest -q --cov=sfmkit --cov-report=term-missing
