# The images, built and pushed to the registry: the CPU pipeline and the
# viewer. Both are built on every push to the default branch, so a broken
# Dockerfile is caught then rather than at release, and pushed on a version tag
# or by hand.
#
# The GPU image is not built here: it pulls CUDA PyTorch and COLMAP's CUDA
# build, which does not fit a hosted runner's disk. Build that one where there
# is a GPU, with `make image DEVICE=gpu`.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "packages/*/Dockerfile"
      - "packages/*/requirements*.txt"
      - "packages/*/src/**"
      - "packages/*/pyproject.toml"
      - "compose.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "push the images to the registry"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sfmkit
            dockerfile: packages/sfmkit/Dockerfile
            moving: cpu          # the tag that follows the default branch
          - image: sfmview
            dockerfile: packages/viewer/Dockerfile
            moving: latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: What to build, and whether to push it
        id: plan
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          tags="$name:${{ matrix.moving }},$name:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$tags,$name:${GITHUB_REF_NAME}"
            push=true
          elif [ "${{ inputs.push }}" = true ]; then
            push=true
          else
            push=false
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "first=$name:${{ matrix.moving }}" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build context is the repository root for both images: they copy the
      # dataset, the configs and the saved example run alongside the package.
      # GIT_COMMIT is baked in, and every run made inside records it.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.plan.outputs.push == 'true' }}
          load: ${{ steps.plan.outputs.push != 'true' }}
          tags: ${{ steps.plan.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # It must at least be able to say what it is. The pipeline is not run
      # here: `match` would download the feature weights, whose licence is not
      # ours to accept on anyone's behalf.
      - name: It starts
        if: steps.plan.outputs.push != 'true'
        run: docker run --rm ${{ steps.plan.outputs.first }} --help
