# This site: built on every change to it, published from the default branch.
#
# Before the first deploy, in the repository's Settings → Pages, set the source
# to "GitHub Actions"; and in website/mkdocs.yml, set site_url to the address
# Pages gives you.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false     # never interrupt a deploy half-published

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: pip install --no-deps -r website/requirements.txt

      # --strict: a broken link or a page missing from the nav fails the build
      # rather than publishing a site with a hole in it.
      - name: Build
        run: mkdocs build --strict -f website/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    name: Publish to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
