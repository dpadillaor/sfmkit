# Everything here is pinned, deliberately, so something has to propose the
# updates. Monthly, one pull request per group, so CI says whether a bump is
# safe before anyone touches an environment by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /packages/sfmkit
      - /packages/viewer
      - /website
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        # Minor and patch travel together; a major arrives on its own, because
        # numpy 2 and OpenCV 5 are each a day's reading, not a line in a list
        # of nineteen.
        update-types: ["minor", "patch"]
    # torch and pycolmap are the environment, not a dependency to bump blindly:
    # a new build changes the matches, and every measurement with them. The
    # CUDA wheels below are torch's own, pinned to the build it was chosen for
    # (cu121): bumped on their own they would not match the torch installed
    # beside them, since everything here goes in with --no-deps.
    ignore:
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: pycolmap
      - dependency-name: triton
      - dependency-name: cuda-toolkit
      - dependency-name: nvidia-*
      # pydantic-core is pydantic's compiled half, pinned to it to the patch:
      # pydantic 2.13.5 requires exactly 2.46.5, and a newer core belongs to a
      # pydantic that is not out yet. It follows pydantic, and moves when
      # pydantic does.
      - dependency-name: pydantic-core
