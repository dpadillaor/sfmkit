<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sfmview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <aside id="sidebar">
    <header class="brand">
      <span class="wordmark">SFMVIEW</span>
      <span class="tagline">structure from motion</span>
    </header>
    <details class="panel" open>
      <summary><span class="num">01</span>Runs</summary>
      <ul id="runs" class="rows runs"></ul>
    </details>
    <details class="panel" open>
      <summary><span class="num">02</span>Layers</summary>
      <ul id="layers" class="rows layers"></ul>
    </details>
    <details class="panel" open>
      <summary><span class="num">03</span>Cameras</summary>
      <ul id="cameras" class="rows cameras"></ul>
    </details>
    <details class="panel" open>
      <summary><span class="num">04</span>Run</summary>
      <dl id="info" class="info"></dl>
    </details>
  </aside>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="photo-bar" class="overlay photo-bar" hidden>
      <span id="photo-name" class="photo-name"></span>
      <label class="field">opacity <input id="photo-opacity" type="range" min="0" max="1" step="0.05"></label>
      <button id="photo-back" type="button" class="key">back to camera</button>
      <button id="photo-close" type="button" class="key" title="close (Esc)">esc</button>
    </div>
    <div id="timeline" class="overlay timeline" hidden>
      <span id="live-badge" class="live" hidden>live</span>
      <span id="step-count" class="step-count"></span>
      <div id="steps" class="steps" role="group" aria-label="steps"></div>
      <span id="step-label" class="step-label"></span>
    </div>
    <footer class="statusbar">
      <span id="status" class="status"></span>
      <span class="hints">
        <kbd>drag</kbd> orbit <kbd>right-drag</kbd> pan <kbd>wheel</kbd> zoom
        <kbd>click</kbd> camera: look through <kbd>←</kbd><kbd>→</kbd> step
      </span>
    </footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
