<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sfmview</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <!-- three.js and the fonts are kept in vendor/, so the page needs no network. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <aside id="sidebar">
    <header class="brand">
      <span class="wordmark">SFMVIEW</span>
      <span class="tagline">Structure From Motion</span>
    </header>
    <details class="panel" open>
      <summary><span class="num">01</span>Runs</summary>
      <ul id="runs" class="rows runs"></ul>
    </details>
    <details class="panel" open>
      <summary><span class="num">02</span>Layers</summary>
      <ul id="layers" class="rows layers"></ul>
    </details>
    <details class="panel" open>
      <summary><span class="num">03</span>Cameras</summary>
      <ul id="cameras" class="rows cameras"></ul>
    </details>
    <details class="panel" open>
      <summary><span class="num">04</span>Run</summary>
      <dl id="info" class="info"></dl>
    </details>
  </aside>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="hover-label" class="hover-label" hidden></div>
    <div id="photo-bar" class="overlay photo-bar" hidden>
      <div class="line">
        <span id="photo-name" class="photo-name"></span>
        <label class="field">opacity <input id="photo-opacity" type="range" min="0" max="1" step="0.05"></label>
        <button id="photo-back" type="button" class="key">back to camera</button>
        <button id="photo-close" type="button" class="key" title="close (Esc)">esc</button>
      </div>
      <div class="line">
        <span class="line-name">frustum</span>
        <label class="field">show <input id="cone-show" type="range" min="0" max="1" step="0.05"
          title="how strongly the camera's view is drawn"></label>
        <label class="field">reach <input id="cone-far" type="range" min="0.2" max="3" step="0.1"
          title="how far out the camera's view reaches"></label>
      </div>
    </div>
    <div id="timeline" class="overlay timeline" hidden>
      <span id="live-badge" class="live" hidden>live</span>
      <span id="step-count" class="step-count"></span>
      <div id="steps" class="steps" role="group" aria-label="steps"></div>
      <span id="step-label" class="step-label"></span>
    </div>
    <footer class="statusbar">
      <span id="status" class="status"></span>
      <span class="hints">
        <kbd>drag</kbd> orbit <kbd>right-drag</kbd> pan <kbd>wheel</kbd> zoom
        <kbd>click</kbd> a camera's lines: look through <kbd>←</kbd><kbd>→</kbd> step
      </span>
    </footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
