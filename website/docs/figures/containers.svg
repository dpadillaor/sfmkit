<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 612" width="1040" height="612">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1.5 L9,5 L0,8.5 z" fill="#9a9a94"/>
    </marker>
    <style>
      text { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
      .card { fill: #ffffff; stroke: #dcdcd7; }
      .win  { fill: #ffffff; stroke: #3b3b38; stroke-width: 1.6; }
      .bar  { fill: #f2f2ef; stroke: #3b3b38; stroke-width: 1.6; }
      .dot  { fill: #c9c9c3; }
      .cyl  { fill: #fafaf8; stroke: #8c8c8c; stroke-width: 1.4; }
      .cmd  { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 14.5px; }
      .term { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 10.5px; fill: #3b3b38; }
      .what { font-size: 11.5px; fill: #6d6d68; }
      .tag  { font-size: 10px; fill: #9a9a94; letter-spacing: 1.4px; }
      .flow { fill: none; stroke: #9a9a94; stroke-width: 1.4; marker-end: url(#a); }
      .hint { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 9px; fill: #8e8e88; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="1039" height="611" rx="14" fill="#ffffff" stroke="#e7e7e3"/>

  <rect class="win" x="70" y="30" width="230" height="104" rx="5"/>
  <path class="bar" d="M70,35 a5,5 0 0 1 5,-5 h220 a5,5 0 0 1 5,5 v17 h-230 z"/>
  <circle class="dot" cx="83" cy="43" r="3.4"/><circle class="dot" cx="95" cy="43" r="3.4"/><circle class="dot" cx="107" cy="43" r="3.4"/>
  <text class="term" x="86" y="80">$ docker compose run</text>
  <text class="term" x="86" y="100">    cli run --config …</text>

  <rect class="win" x="770" y="30" width="230" height="104" rx="5"/>
  <path class="bar" d="M770,35 a5,5 0 0 1 5,-5 h220 a5,5 0 0 1 5,5 v17 h-230 z"/>
  <circle class="dot" cx="783" cy="43" r="3.4"/><circle class="dot" cx="795" cy="43" r="3.4"/>
  <rect x="808" y="35" width="180" height="14" rx="7" fill="#ffffff" stroke="#c9c9c3"/>
  <text x="898" y="45" text-anchor="middle" font-size="9" fill="#6d6d68"
        font-family="'Roboto Mono', ui-monospace, monospace">127.0.0.1:8000</text>
  <circle cx="830" cy="90" r="2.4" fill="#f2a93b"/><circle cx="848" cy="78" r="2.4" fill="#f2a93b"/>
  <circle cx="866" cy="96" r="2.4" fill="#56a8f5"/><circle cx="884" cy="74" r="2.4" fill="#f2a93b"/>
  <circle cx="902" cy="88" r="2.4" fill="#56a8f5"/><circle cx="920" cy="70" r="2.4" fill="#f2a93b"/>
  <circle cx="938" cy="94" r="2.4" fill="#56a8f5"/><circle cx="956" cy="80" r="2.4" fill="#f2a93b"/>
  <circle cx="840" cy="108" r="2.4" fill="#56a8f5"/><circle cx="878" cy="112" r="2.4" fill="#f2a93b"/>
  <circle cx="916" cy="106" r="2.4" fill="#56a8f5"/><circle cx="950" cy="114" r="2.4" fill="#ff6fae"/>

  <rect x="40" y="180" width="960" height="262" rx="8" fill="none" stroke="#2496ed"
        stroke-width="1.4" stroke-dasharray="7 5"/>
  <rect x="410" y="171" width="220" height="18" fill="#ffffff"/>
  <text class="tag" x="520" y="185" text-anchor="middle" style="fill:#2496ed">Docker Compose · one network</text>

  <rect class="card" x="70" y="220" width="250" height="120" rx="4"/>
  <rect x="70" y="220" width="3" height="120" fill="#f2a93b"/>
  <rect x="266" y="232" width="34" height="5" rx="2.5" fill="#f2a93b"/>
  <rect x="262" y="242" width="38" height="5" rx="2.5" fill="#c9a86b"/>
  <rect x="258" y="252" width="42" height="5" rx="2.5" fill="#dcd6c8"/>
  <text class="cmd" x="86" y="250" fill="#96620c">cli</text>
  <text class="what" x="86" y="282">Runs the pipeline, as your</text>
  <text class="what" x="86" y="296">own user and not as root</text>
  <text class="what" x="86" y="314">The example project is baked</text>
  <text class="what" x="86" y="328">in, so it works with no mount</text>

  <rect class="card" x="395" y="220" width="250" height="120" rx="4"/>
  <rect x="395" y="220" width="3" height="120" fill="#8c8c8c"/>
  <rect x="591" y="232" width="34" height="5" rx="2.5" fill="#8c8c8c"/>
  <rect x="587" y="242" width="38" height="5" rx="2.5" fill="#b9b9b3"/>
  <rect x="583" y="252" width="42" height="5" rx="2.5" fill="#dcdcd7"/>
  <text class="cmd" x="411" y="250" fill="#55554f">redis</text>
  <rect x="470" y="237" width="54" height="17" rx="8.5" fill="#f2f2ef" stroke="#dcdcd7"/>
  <text x="497" y="249" text-anchor="middle" font-size="9.5" fill="#6d6d68"
        font-family="'Roboto Mono', ui-monospace, monospace">:6379</text>
  <text class="what" x="411" y="282">Every stage and every camera,</text>
  <text class="what" x="411" y="296">as the run happens</text>
  <text class="what" x="411" y="314">Found by name on the network,</text>
  <text class="what" x="411" y="328">and never published</text>

  <rect class="card" x="720" y="220" width="250" height="120" rx="4"/>
  <rect x="720" y="220" width="3" height="120" fill="#ff4f00"/>
  <rect x="916" y="232" width="34" height="5" rx="2.5" fill="#ff4f00"/>
  <rect x="912" y="242" width="38" height="5" rx="2.5" fill="#f0a184"/>
  <rect x="908" y="252" width="42" height="5" rx="2.5" fill="#f4d6cb"/>
  <text class="cmd" x="736" y="250" fill="#b83a06">viewer</text>
  <rect x="802" y="237" width="54" height="17" rx="8.5" fill="#eaf4fd" stroke="#bcddf8"/>
  <text x="829" y="249" text-anchor="middle" font-size="9.5" fill="#1a6bb5"
        font-family="'Roboto Mono', ui-monospace, monospace">:8000</text>
  <text class="what" x="736" y="282">Serves the page and relays</text>
  <text class="what" x="736" y="296">the stream to it, live</text>
  <text class="what" x="736" y="314">Waits for redis to answer</text>
  <text class="what" x="736" y="328">before it starts</text>

  <ellipse class="cyl" cx="150" cy="370" rx="36" ry="12"/>
  <path class="cyl" d="M114,370 V400 a36,12 0 0 0 72,0 V370"/>
  <text class="hint" x="150" y="424" text-anchor="middle">weights</text>

  <ellipse class="cyl" cx="475" cy="370" rx="36" ry="12"/>
  <path class="cyl" d="M439,370 V400 a36,12 0 0 0 72,0 V370"/>
  <text class="hint" x="475" y="424" text-anchor="middle">redis-data</text>

  <path d="M405,497 h44 l10,12 h221 a5,5 0 0 1 5,5 v72 a5,5 0 0 1 -5,5 h-275 a5,5 0 0 1 -5,-5 v-84 a5,5 0 0 1 5,-5 z"
        fill="#ffffff" stroke="#3b3b38" stroke-width="1.6"/>
  <text class="cmd" x="428" y="542" fill="#1b1b1a">./projects</text>
  <text class="what" x="428" y="562">On your disk: the photographs, the</text>
  <text class="what" x="428" y="576">configs, everything a run writes</text>

  <path class="flow" d="M240,134 V216"/>
  <path class="flow" d="M870,216 V138"/>

  <path class="flow" d="M320,268 H391"/>
  <text class="hint" x="355" y="258" text-anchor="middle">stream</text>
  <path class="flow" d="M645,268 H716"/>
  <text class="hint" x="680" y="258" text-anchor="middle">stream</text>

  <path class="flow" d="M150,340 V354"/>
  <path class="flow" d="M475,340 V354"/>

  <path class="flow" d="M240,340 V460 H470 V493"/>
  <text class="hint" x="355" y="474" text-anchor="middle">read and write</text>
  <path class="flow" d="M870,340 V460 H620 V493"/>
  <text class="hint" x="745" y="474" text-anchor="middle">read only</text>
</svg>
