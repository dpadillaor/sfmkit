# One style for every package; `ruff check .` from the root lints them all.
line-length = 100
src = [
    "packages/sfmkit/src", "packages/sfmkit/tests",
    "packages/viewer/src", "packages/viewer/tests",
]
# legacy/ holds the original course code and the scripts that reproduced its
# baseline, kept for reference until it is removed. Linting it would mean
# editing it, which would defeat the point of keeping it.
exclude = ["legacy"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
