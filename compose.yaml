services:
  cli:
    build:
      context: .  # the root, so the image can take the Valencia example
      dockerfile: packages/sfmkit/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        DEVICE: cpu
    image: sfmkit:cpu
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - ./runs:/app/runs

  # The same, built with CUDA PyTorch and COLMAP and given the GPU. The host needs
  # the NVIDIA driver and nvidia-container-toolkit.
  cli-gpu:
    extends: cli
    build:
      args:
        DEVICE: gpu
    image: sfmkit:gpu
    gpus: all

  # The web viewer: it only reads runs/ and data/. The port is published on the
  # host's loopback only; from another machine, through an SSH tunnel.
  viewer:
    build:
      context: .
      dockerfile: packages/viewer/Dockerfile
    image: sfmview
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs:ro
    ports:
      - "127.0.0.1:8000:8000"
