name: sfmkit

services:
  cli:
    build:
      context: .
      dockerfile: packages/sfmkit/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        DEVICE: cpu
    image: sfmkit:cpu
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      SFMKIT_BROKER: redis://redis:6379
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - ./runs:/app/runs

  cli-gpu:
    extends: cli
    build:
      args:
        DEVICE: gpu
    image: sfmkit:gpu
    gpus: all

  viewer:
    build:
      context: .
      dockerfile: packages/viewer/Dockerfile
    image: sfmview
    environment:
      SFMVIEW_BROKER: redis://redis:6379
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
