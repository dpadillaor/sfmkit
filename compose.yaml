# The images are named as they are published, so `docker compose pull` fetches
# them instead of building: someone who only wants to look at a run should not
# wait for a build. `docker compose build` still builds into the same names.
name: sfmkit

services:
  cli:
    build:
      context: .
      dockerfile: packages/sfmkit/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        DEVICE: cpu
    image: ghcr.io/dpadillaor/sfmkit:cpu
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      SFMKIT_BROKER: redis://redis:6379
    volumes:
      # One mount: a project holds its photographs, its configs and its runs,
      # so there is one path to get right instead of three. It is writable
      # because a run writes inside it; that a run writes nothing else is
      # checked in CI rather than promised by the mount.
      - ./projects:/app/projects
      - ${SFMKIT_WEIGHTS:-weights}:/opt/torch

  cli-gpu:
    extends: cli
    build:
      args:
        DEVICE: gpu
        EXAMPLE: gpu-dense
    image: ghcr.io/dpadillaor/sfmkit:gpu
    gpus: all

  viewer:
    build:
      context: .
      dockerfile: packages/viewer/Dockerfile
    image: ghcr.io/dpadillaor/sfmview
    environment:
      SFMVIEW_BROKER: redis://redis:6379
    volumes:
      - ./projects:/app/projects:ro   # the viewer only ever reads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    # A named volume, so `down` no longer takes the streams with it: a finished
    # run's timeline survives the containers being recreated, until its own
    # week is up.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

volumes:
  weights:
  redis-data:
