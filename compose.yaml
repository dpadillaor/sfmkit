services:
  cli:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        TORCH: ${TORCH:-cpu}
    image: sfmkit:${TORCH:-cpu}
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - ./runs:/app/runs