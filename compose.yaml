# Not an orchestrator -- a single service, used purely so the volume and GPU
# flags do not have to be retyped on every command. A pipeline of five batch
# stages on one machine does not need service orchestration.
#
# UNTESTED, like the Dockerfile it builds.
services:
  sfmkit:
    build: .
    image: sfmkit:latest
    volumes:
      - ./CV/DPO2/colmap_project/images:/data/images:ro
      - ./runs:/app/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # docker compose run --rm sfmkit reconstruct --config configs/... --out runs/...
