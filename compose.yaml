name: sfmkit

services:
  cli:
    build:
      context: .
      dockerfile: packages/sfmkit/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        DEVICE: cpu
    image: sfmkit:cpu
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      SFMKIT_BROKER: redis://redis:6379
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - ./runs:/app/runs

  # The host needs the NVIDIA driver and nvidia-container-toolkit.
  cli-gpu:
    extends: cli
    build:
      args:
        DEVICE: gpu
    image: sfmkit:gpu
    gpus: all

  viewer:
    build:
      context: .
      dockerfile: packages/viewer/Dockerfile
    image: sfmview
    environment:
      SFMVIEW_BROKER: redis://redis:6379
    volumes:
      - ./data:/app/data:ro
      - ./runs:/app/runs:ro
    ports:
      - "127.0.0.1:8000:8000"

  redis:
    image: redis:7-alpine
